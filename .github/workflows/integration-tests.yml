name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Ejecutar tests cada día a las 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth
          - categories
          - inventory
          - users
          - performance
          - production-validation
          - environment-sync

env:
  NODE_VERSION: '18.x'

jobs:
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Test Matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.test_suite }}" == "all" ]; then
            echo "matrix={\"suite\":[\"auth\",\"categories\",\"inventory\",\"users\",\"performance\"]}" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"suite\":[\"${{ github.event.inputs.test_suite }}\"]}" >> $GITHUB_OUTPUT
          fi

  integration-tests:
    name: Run Integration Tests - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix: ${{fromJson(needs.setup.outputs.test-matrix)}}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup test environment variables
        run: |
          echo "TEST_MODE=${{ github.event.inputs.environment || 'development' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV
      
      - name: Run ${{ matrix.suite }} tests
        run: npm run test:integration -- --testPathPattern="${{ matrix.suite }}" --ci --coverage
        env:
          # Development environment
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          
          # Production environment (for production tests)
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            coverage/
            test-results/
            benchmark-results/
      
      - name: Upload coverage to Codecov
        if: matrix.suite != 'performance'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: integration-${{ matrix.suite }}
          name: ${{ matrix.suite }}-coverage

  production-validation:
    name: Production Validation Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.test_suite == 'production-validation'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run production validation tests
        run: npm run test:integration -- --testPathPattern="vercel-production-validation" --ci
        env:
          TEST_MODE: production
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
      
      - name: Send notification on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production validation tests failed! 🚨'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  performance-benchmark:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.test_suite == 'performance'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance benchmarks
        run: npm run test:integration -- --testPathPattern="performance-benchmarking" --ci
        env:
          TEST_MODE: ${{ github.event.inputs.environment || 'development' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
      
      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest benchmark file
            const benchmarkDir = './benchmark-results';
            const files = fs.readdirSync(benchmarkDir);
            const latestFile = files.sort().reverse()[0];
            
            if (latestFile) {
              const data = JSON.parse(fs.readFileSync(path.join(benchmarkDir, latestFile), 'utf8'));
              
              let comment = '## 📊 Performance Benchmark Results\n\n';
              comment += `Environment: ${data.environment}\n\n`;
              comment += '| Operation | Avg Time (ms) | P95 (ms) | Status |\n';
              comment += '|-----------|---------------|----------|--------|\n';
              
              data.results.forEach(result => {
                const status = result.passed ? '✅' : '❌';
                comment += `| ${result.operation} | ${result.metrics.avg.toFixed(2)} | ${result.metrics.p95} | ${status} |\n`;
              });
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [integration-tests, production-validation, performance-benchmark]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts
      
      - name: Generate test report
        run: |
          echo "# Test Execution Summary" > test-summary.md
          echo "Date: $(date)" >> test-summary.md
          echo "Environment: ${{ github.event.inputs.environment || 'development' }}" >> test-summary.md
          echo "" >> test-summary.md
          
          # Add test results summary
          echo "## Test Results" >> test-summary.md
          for dir in test-artifacts/test-results-*; do
            if [ -d "$dir" ]; then
              suite=$(basename $dir | sed 's/test-results-//')
              echo "### $suite" >> test-summary.md
              # Process test results if available
            fi
          done
      
      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-summary
          path: test-summary.md