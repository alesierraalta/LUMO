name: Quick Choreo Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'

jobs:
  quick-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Quick validation
      run: |
        echo "🚀 Quick Choreo validation..."
        
        # Check critical files
        echo "📋 Checking critical files..."
        required_files=("package.json" "Dockerfile" "choreo.yaml" "next.config.js")
        
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Validate JSON files
        echo "🔍 Validating JSON syntax..."
        if ! jq empty package.json; then
          echo "❌ package.json has syntax errors"
          exit 1
        fi
        echo "✅ package.json is valid JSON"
        
        # Check for merge conflicts
        echo "🔍 Checking for merge conflicts..."
        if grep -r "<<<<<<< HEAD\|=======" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Merge conflict markers found"
          exit 1
        fi
        echo "✅ No merge conflicts detected"
        
        # Check package.json scripts
        echo "📦 Validating package.json scripts..."
        if ! jq -e '.scripts.build' package.json > /dev/null; then
          echo "❌ Missing build script"
          exit 1
        fi
        
        if ! jq -e '.scripts.start' package.json > /dev/null; then
          echo "❌ Missing start script"
          exit 1
        fi
        echo "✅ Required scripts found"
        
        # Basic Dockerfile validation
        echo "🐳 Basic Dockerfile validation..."
        if ! grep -q "FROM node:" Dockerfile; then
          echo "❌ Dockerfile doesn't use Node.js base image"
          exit 1
        fi
        
        if ! grep -q "WORKDIR /workspace" Dockerfile; then
          echo "❌ Dockerfile doesn't use /workspace as working directory"
          exit 1
        fi
        echo "✅ Dockerfile structure looks good"
        
        echo "🎉 Quick validation passed! Ready for full Choreo test."
        
    - name: Install dependencies (quick check)
      run: |
        echo "📦 Quick dependency check..."
        npm ci --legacy-peer-deps --dry-run
        echo "✅ Dependencies can be installed"
        
    - name: Build check (no Docker)
      run: |
        echo "🏗️ Quick build check..."
        npm ci --legacy-peer-deps
        
        # Set minimal environment for build test
        export NODE_ENV=production
        export NEXT_PUBLIC_SUPABASE_URL="${{ secrets.SUPABASE_URL_PROD || 'https://test.supabase.co' }}"
        export NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_KEY_PROD || 'test-key' }}"
        export DATABASE_URL="${{ secrets.DATABASE_URL_PROD || 'postgresql://test:test@localhost:5432/test' }}"
        export JWT_SECRET="${{ secrets.JWT_SECRET || 'test-jwt-secret-minimum-32-characters-long' }}"
        
        # Try to build (this will catch most build issues)
        if npm run build; then
          echo "✅ Build successful"
          
          # Check if standalone build was created
          if [ -f ".next/standalone/server.js" ]; then
            echo "✅ Standalone server.js created"
          else
            echo "⚠️ Standalone server.js not found"
          fi
          
          # Check if BUILD_ID was created
          if [ -f ".next/BUILD_ID" ]; then
            echo "✅ BUILD_ID created"
          else
            echo "⚠️ BUILD_ID not found"
          fi
          
        else
          echo "❌ Build failed"
          exit 1
        fi
        
    - name: Summary
      if: always()
      run: |
        echo "📊 Quick Test Summary"
        echo "===================="
        echo "✅ File structure validation passed"
        echo "✅ JSON syntax validation passed"
        echo "✅ Merge conflict check passed"
        echo "✅ Dependency check passed"
        echo "✅ Build check passed"
        echo ""
        echo "🚀 Ready for full Docker testing!"
        echo "   Run the 'Test Choreo Build' workflow for complete validation." 