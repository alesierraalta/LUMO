name: 🧪 Tests - Full Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # Global test environment settings
  CI: true
  NODE_ENV: test
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  test:
    name: 🧪 Run Complete Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        database: [production, development]
        
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 🗂️ Cache Next.js Build
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🔧 Setup Environment - Production DB
      if: matrix.database == 'production'
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://postgres:[password]@db.ubjujxtvlubxowsphvuk.supabase.co:5432/postgres" >> $GITHUB_ENV
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
        echo "FORCE_SUPABASE=true" >> $GITHUB_ENV
        echo "TEST_DATABASE=production" >> $GITHUB_ENV
        
    - name: 🔧 Setup Environment - Development DB  
      if: matrix.database == 'development'
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://postgres:[password]@db.ndprriqyhddjoixrlqnz.supabase.co:5432/postgres" >> $GITHUB_ENV
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
        echo "FORCE_SUPABASE=true" >> $GITHUB_ENV
        echo "TEST_DATABASE=development" >> $GITHUB_ENV

    - name: 🔧 Setup Additional Environment Variables
      run: |
        echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> $GITHUB_ENV
        echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV
        echo "NEXTAUTH_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
        echo "SKIP_ENV_VALIDATION=true" >> $GITHUB_ENV
        
    - name: 🔧 Validate Environment Setup
      run: |
        echo "✅ Node.js version: $(node --version)"
        echo "✅ NPM version: $(npm --version)"
        echo "✅ Database: ${{ matrix.database }}"
        echo "✅ Environment variables configured"
        node -e "console.log('✅ JWT_SECRET length:', process.env.JWT_SECRET ? process.env.JWT_SECRET.length : 'Missing')"
        
    - name: 🔧 Prepare Test Environment
      run: |
        echo "✅ Preparing test environment..."
        npm run test:clear-cache || echo "Cache clear skipped"
        echo "✅ Test environment ready"
        
    - name: 🧪 Run Unit Tests
      run: |
        echo "🧪 Starting unit tests..."
        npm run test:unit
      continue-on-error: false
      
    - name: 🧪 Run Integration Tests  
      run: |
        echo "🧪 Starting integration tests with sequential execution..."
        npm run test:integration -- --runInBand --maxWorkers=1 --forceExit --testTimeout=60000
      continue-on-error: false
      
    - name: 🧪 Run End-to-End Tests
      run: |
        echo "🧪 Installing Playwright..."
        npx playwright install --with-deps chromium
        echo "🧪 Starting E2E tests..."
        npm run test:e2e
      continue-on-error: false
      
    - name: 🧪 Run Performance Tests
      run: |
        echo "🧪 Starting performance tests..."
        npm run test:performance
      continue-on-error: false
      
    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.database }}
        path: |
          test-results/
          coverage/
          playwright-report/
          
    - name: 📊 Test Summary
      if: always()
      run: |
        echo "### 🧪 Test Results for ${{ matrix.database }} Database" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📝 **Database**: ${{ matrix.database }}" >> $GITHUB_STEP_SUMMARY
        echo "🕒 **Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY 