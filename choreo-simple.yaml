version: 1.0
build:
  buildpacks:
    - name: nodejs
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
deploy:
  resources:
    cpu: 1.0
    memory: 1Gi
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
  docker:
    context: .
    buildArgs:
      NODE_ENV: production
  health:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
  startup:
    shell: /bin/sh
    command: |-
      echo "Starting with monkey-patching for entryCSSFiles fix..."
      # Run fix-manifests first to ensure CSS files exist
      node scripts/fix-manifests.js
      # Start with monkey-patching to handle any remaining issues
      node -r ./monkey-patch.js .next/standalone/server.js 