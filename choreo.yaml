apiVersion: core.choreo.dev/v1beta1
kind: Component
metadata:
  name: lumo
spec:
  type: web-application
  build:
    buildType: dockerfile
    dockerfilePath: ./Dockerfile
  container:
    image: lumo:latest
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "8080"
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"
    - name: HOSTNAME
      value: "0.0.0.0"
  secrets:
    - name: NEXT_PUBLIC_SUPABASE_URL
    - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - name: JWT_SECRET
    - name: DATABASE_URL
  endpoints:
    - name: lumo
      service:
        name: lumo
        port: 8080
      context: /
      schema:
        openapi: "3.0.0"
        info:
          title: LUMO API
          version: "1.0.0"
  probes:
    readiness:
      path: /api/health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 3
    liveness:
      path: /api/health
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5 