apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory-simple
  description: "LUMO Inventory - Simplified Build Configuration"
spec:
  type: Web Application
  runtime:
    type: docker
  build:
    # Minimal build configuration
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=2048"
    # Remove complex build commands that might trigger status updates
    timeoutSeconds: 900
  deploy:
    command: ./start.sh
    containerPort: 8080
  # Environment variables (consolidated, no duplicates)
  env:
    - name: CHOREO_ENVIRONMENT
      value: "{{ .Values.environment }}"  # This will be 'dev' or 'prod' from Choreo
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "8080"
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
    - name: NEXT_PUBLIC_SUPABASE_URL
      valueFrom:
        secretRef:
          name: NEXT_PUBLIC_SUPABASE_URL
    - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
      valueFrom:
        secretRef:
          name: NEXT_PUBLIC_SUPABASE_ANON_KEY
  # Conservative resource allocation
  resources:
    cpu:
      units: 2
    memory:
      units: 4Gi
  # Simple scaling
  scaling:
    minReplicas: 1
    maxReplicas: 2
  # Optimized health checks - reduced initial delay to prevent premature failures
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 15  # Reduced from 30 to prevent early failures
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 30  # Reduced from 60 to catch issues earlier
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 8080 