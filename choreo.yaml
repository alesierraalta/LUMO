apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System - Production Ready"
spec:
  type: Web Application
  buildPack: Node.js
  runtime:
    type: nodejs
    version: "20"
  build:
    env:
      NEXT_PUBLIC_DEPLOY_ENV: choreo
      NEXT_PUBLIC_API_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      APP_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=8192"
      ENABLE_TURBO_CACHE: "true"
      NEXT_SWC_MINIFY: "true"
      TURBO_CACHE_DIR: "/tmp/.turbo-cache"
      TURBO_TEAM: "lumo-inventory"
      TURBO_REMOTE_ONLY: "true"
      NEXT_MINIMAL_TRACE: "1"
      NEXT_WEBPACK_DISABLE_DEV_CHECKS: "1" 
      NEXT_OPTIMIZE_IMAGES: "1"
      NEXT_OPTIMIZE_CSS: "1"
      NEXT_OPTIMIZE_FONTS: "1"
    command: chmod +x build-fast.sh && ./build-fast.sh
    extraSteps:
      - name: Instalación Prisma CLI y Herramientas de Optimización
        command: |
          npm install -g prisma@6.7.0 turbo@latest node-prune@latest
          npm install --no-save --no-package-lock --ignore-scripts swc
          node -e "fs.mkdirSync('/tmp/.turbo-cache', { recursive: true })"
          
      - name: Optimización de Módulos
        command: |
          npx node-prune
          find node_modules -type d -name "tests" -o -name "test" -o -name "examples" -o -name "docs" | xargs rm -rf || true
      
      - name: Preparación del Entorno Extrema
        command: node scripts/extreme-build-optimization.js
      
      - name: Generar Cliente Prisma (Optimizado)
        command: npx prisma generate --schema=prisma/schema.prisma

      - name: Preparación de Directorios Esenciales
        command: |
          mkdir -p .next/standalone/node_modules/.prisma/client
          mkdir -p .next/standalone/scripts/
          mkdir -p .next/standalone/prisma/
          mkdir -p .next/standalone/.next/server/app/api/inventory/import/process/dict
          mkdir -p .next/standalone/tmp/
          mkdir -p .next/standalone/logs/
      
      - name: Copia Paralela de Archivos Esenciales
        command: |
          cp -r node_modules/.prisma/client/libquery_engine* .next/standalone/node_modules/.prisma/client/ || echo "No engine files found"
          chmod +x .next/standalone/node_modules/.prisma/client/libquery_engine* || echo "No engine files to make executable"
          cp scripts/fix-*.js .next/standalone/scripts/ || echo "No fix scripts found"
          cp scripts/test-*.js .next/standalone/scripts/ || echo "No test scripts found"
          cp scripts/ensure-*.js .next/standalone/scripts/ || echo "No ensure scripts found"
          cp scripts/verify-*.js .next/standalone/scripts/ || echo "No verify scripts found"
          cp scripts/choreo-*.js .next/standalone/scripts/ || echo "No choreo scripts found"
          cp scripts/import-*.js .next/standalone/scripts/ || echo "No import scripts found"
          cp scripts/audit-*.js .next/standalone/scripts/ || echo "No audit scripts found"
          cp scripts/run-*.js .next/standalone/scripts/ || echo "No run scripts found"
          chmod +x .next/standalone/scripts/*.js || echo "Could not make scripts executable"
      
      - name: Copia de Prisma Schema y Generar Cliente en Standalone
        command: |
          cp -r prisma/* .next/standalone/prisma/ || echo "No prisma files found"
          cd .next/standalone
          npx prisma generate --schema=../../prisma/schema.prisma
      
      - name: Verificación Final y Optimización
        command: |
          ls -la .next/standalone/node_modules/.prisma/client/ || echo "Directory doesn't exist yet"
          node scripts/optimize-postbuild.js
          node prepare-for-choreo.js
    retryCount: 3
    timeoutSeconds: 900
    network:
      connectTimeoutSeconds: 120
  deploy:
    command: node scripts/fix-all-choreo-issues.js && node scripts/choreo-preflight.js && node scripts/ensure-import-dirs.js && node server.js
    env:
      NODE_ENV: production
      PORT: 8080
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      DEPLOY_ENV: choreo
      CLERK_JWT_VERIFICATION_KEY: ${{ secrets.CLERK_JWT_VERIFICATION_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    containerPort: 8080
    baseMount: .next/standalone
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    # Database Configuration - REQUIRED
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    # JWT Secret for custom auth - REQUIRED
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
  resources:
    cpu:
      units: 2
    memory:
      units: 8Gi
  scaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 90
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 8080
  ignoreSpec:
    ignore:
      - node_modules
      - .git
      - .github
      - .next
      - .env
      - .env.local
      - .env.development
      - .env.production
      - README.md
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/__tests__/**"
      - "**/__mocks__/**"
      - "**/coverage/**"
  - name: CUSTOM_BUILD_COMMAND
    value: chmod +x build-fast.sh && ./build-fast.sh
  - name: CUSTOM_START_COMMAND
    value: node scripts/fix-all-choreo-issues.js && node scripts/choreo-preflight.js && node scripts/ensure-import-dirs.js && node server.js 