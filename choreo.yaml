apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System - Production Ready"
spec:
  type: Web Application
  buildPack: Node.js
  runtime:
    type: nodejs
    version: "20"
  build:
    command: |
      echo "[BUILD] Installing dependencies..."
      npm ci --prefer-offline --no-audit
      echo "[BUILD] Fixing Prisma schema for production..."
      node scripts/fix-prisma-schema.js
      echo "[BUILD] Switching to production mode..."
      npm run mode:prod
      echo "[BUILD] Running pre-build scripts..."
      npm run prebuild
      echo "[BUILD] Fixing Next.js configuration..."
      node scripts/fix-next-config.js
      echo "[BUILD] Building application..."
      npm run build
      echo "[BUILD] Running post-build scripts..."
      npm run postbuild
      echo "[BUILD] Build completed successfully!"
    env:
      - name: NODE_ENV
        value: "production"
    retryCount: 3
    timeoutSeconds: 900
    network:
      connectTimeoutSeconds: 120
  deploy:
    command: |
      echo "[DEPLOY] 🚀 Starting LUMO Inventory deployment..."
      echo "[DEPLOY] Current directory: $(pwd)"
      echo "[DEPLOY] Checking build artifacts:"
      ls -la .next/
      echo "[DEPLOY] Checking server files:"
      [ -f choreo-server.js ] && echo "✅ choreo-server.js found" || echo "❌ choreo-server.js missing"
      [ -f server.js ] && echo "✅ server.js found" || echo "❌ server.js missing"
      echo "[DEPLOY] Environment variables:"
      echo "NODE_ENV: $NODE_ENV"
      echo "PORT: $PORT"
      echo "[DEPLOY] Ejecutando migración de la base de datos..."
      npx prisma db push --accept-data-loss
      echo "[DEPLOY] Verificando usuario administrador..."
      node scripts/ensure-admin.js
      echo "[DEPLOY] Starting custom Choreo server..."
      node choreo-server.js
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    # Database Configuration - REQUIRED
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    # JWT Secret for custom auth - REQUIRED
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
  resources:
    cpu:
      units: 1
    memory:
      units: 2Gi
  scaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 90
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 8080 