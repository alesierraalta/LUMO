apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System"
spec:
  type: Web Application
  buildPack: Node.js
  runtime:
    type: nodejs
    version: "20"
  build:
    command: npm run build
    env:
      - name: NEXT_PUBLIC_SKIP_CLERK_AUTH
        value: "true"
      - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: "pk_test_dummy-key-for-build"
      - name: CLERK_SECRET_KEY
        value: "sk_test_dummy-key-for-build"
  deploy:
    command: node scripts/debug-runtime.js && node .next/standalone/server.js
  env:
    - name: NODE_ENV
      value: production
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    - name: CLERK_SECRET_KEY
      valueFrom:
        secretRef:
          name: CLERK_SECRET_KEY
    - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      valueFrom:
        secretRef:
          name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    - name: NEXT_PUBLIC_SKIP_CLERK_AUTH
      value: "false"
    # Add your actual Clerk keys here temporarily for testing
    # Replace with your real values:
    - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      value: "pk_live_REPLACE_WITH_YOUR_REAL_KEY"
    - name: CLERK_SECRET_KEY
      value: "sk_live_REPLACE_WITH_YOUR_REAL_SECRET"
    # Add your database URL
    - name: DATABASE_URL
      value: "postgresql://REPLACE_WITH_YOUR_DATABASE_URL"
  resources:
    cpu:
      units: 1.0
    memory:
      units: 1.0Gi
  scaling:
    minReplicas: 1
    maxReplicas: 3
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
  expose:
    type: HTTP
    port: 8080 