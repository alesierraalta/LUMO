apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System - Production Ready"
spec:
  type: Web Application
  buildPack: Node.js
  runtime:
    type: nodejs
    version: "20"
  build:
    env:
      NEXT_PUBLIC_DEPLOY_ENV: choreo
      NEXT_PUBLIC_API_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      APP_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      ENABLE_TURBO_CACHE: "true"
      NEXT_SWC_MINIFY: "true"
    command: chmod +x build-fast.sh && ./build-fast.sh
    extraSteps:
      - name: Instalación Prisma CLI
        command: npm install -g prisma@6.7.0
      - name: Generar Cliente Prisma
        command: npx prisma generate --schema=prisma/schema.prisma
      - name: Copiar Motores de Prisma
        command: |
          mkdir -p .next/standalone/node_modules/.prisma/client
          cp -r node_modules/.prisma/client/libquery_engine* .next/standalone/node_modules/.prisma/client/ || echo "No engine files found"
          chmod +x .next/standalone/node_modules/.prisma/client/libquery_engine* || echo "No engine files to make executable"
          ls -la node_modules/.prisma/client/ || echo "Can't list client dir"
      - name: Copiar Scripts de Corrección
        command: |
          mkdir -p .next/standalone/scripts/
          cp scripts/fix-choreo-deploy.js .next/standalone/scripts/
          cp scripts/fix-database-env.js .next/standalone/scripts/
          cp scripts/copy-prisma-engines.js .next/standalone/scripts/
          cp scripts/fix-all-choreo-issues.js .next/standalone/scripts/
          cp scripts/test-import-session.js .next/standalone/scripts/
          chmod +x .next/standalone/scripts/*.js || echo "Could not make scripts executable"
      - name: Generar Cliente Prisma en Standalone
        command: |
          cd .next/standalone
          npx prisma generate --schema=../../prisma/schema.prisma
      - name: Verificar Archivos Clave
        command: ls -la .next/standalone/node_modules/.prisma/client/ || echo "Directory doesn't exist yet"
      - name: Verificar Permisos Scripts
        command: node prepare-for-choreo.js
    retryCount: 3
    timeoutSeconds: 900
    network:
      connectTimeoutSeconds: 120
  deploy:
    command: node scripts/fix-all-choreo-issues.js && node scripts/choreo-preflight.js && node scripts/ensure-import-dirs.js && node server.js
    env:
      NODE_ENV: production
      PORT: 8080
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      DEPLOY_ENV: choreo
      CLERK_JWT_VERIFICATION_KEY: ${{ secrets.CLERK_JWT_VERIFICATION_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    containerPort: 8080
    baseMount: .next/standalone
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    # Database Configuration - REQUIRED
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    # JWT Secret for custom auth - REQUIRED
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
  resources:
    cpu:
      units: 2
    memory:
      units: 4Gi
  scaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 90
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 8080
  ignoreSpec:
    ignore:
      - node_modules
      - .git
      - .github
      - .next
      - .env
      - .env.local
      - .env.development
      - .env.production
      - README.md
  - name: CUSTOM_BUILD_COMMAND
    value: chmod +x build-fast.sh && ./build-fast.sh
  - name: CUSTOM_START_COMMAND
    value: node scripts/fix-all-choreo-issues.js && node scripts/choreo-preflight.js && node scripts/ensure-import-dirs.js && node server.js 