apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System - Production Ready"
spec:
  type: Web Application
  buildPack: Node.js
  runtime:
    type: nodejs
    version: "20"
  build:
    env:
      NEXT_PUBLIC_DEPLOY_ENV: choreo
      NEXT_PUBLIC_API_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      APP_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
    command: npm run build
    extraSteps:
      - name: Copy Scripts to Standalone
        command: cp -r scripts .next/standalone/
      - name: Verify Files
        command: ls -la .next/standalone/scripts/
      - name: Add Execute Permissions
        command: chmod +x .next/standalone/scripts/*.js
      - name: Copy ImportSession Fix Scripts
        command: |
          cp scripts/fix-import-session-postgres.js .next/standalone/scripts/
          cp scripts/fix-import-session-sqlite.js .next/standalone/scripts/
          cp scripts/fix-import-session-auto.js .next/standalone/scripts/
      - name: Copy Prisma Schema
        command: cp -r prisma .next/standalone/
      - name: Copy Preflight Script
        command: cp scripts/choreo-preflight.js .next/standalone/scripts/
      - name: Copy Essential Node Modules
        command: |
          mkdir -p .next/standalone/node_modules/server-only
          cp -r node_modules/server-only/* .next/standalone/node_modules/server-only/
      - name: Create Import Directories
        command: |
          mkdir -p .next/standalone/.next/server/app/api/inventory/import/process/dict
          mkdir -p .next/standalone/node_modules/.prisma/client
    retryCount: 3
    timeoutSeconds: 900
    network:
      connectTimeoutSeconds: 120
  deploy:
    command: node scripts/choreo-preflight.js && node scripts/ensure-import-dirs.js && node server.js
    env:
      NODE_ENV: production
      PORT: 8080
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      DEPLOY_ENV: choreo
      CLERK_JWT_VERIFICATION_KEY: ${{ secrets.CLERK_JWT_VERIFICATION_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    containerPort: 8080
    baseMount: .next/standalone
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    # Database Configuration - REQUIRED
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    # JWT Secret for custom auth - REQUIRED
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
  resources:
    cpu:
      units: 1
    memory:
      units: 2Gi
  scaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 90
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 8080
  ignoreSpec:
    ignore:
      - node_modules
      - .git
      - .github
      - .next
      - .env
      - .env.local
      - .env.development
      - .env.production
      - README.md 