apiVersion: core.choreo.dev/v1alpha1
kind: Component
metadata:
  name: lumo-inventory-dockerfile
  projectName: ${CHOREO_PROJECT}
  description: "LUMO Inventory Management System - Dockerfile Build (Buildpack Bypass)"
spec:
  type: Web Application
  # REMOVED: buildPack to force Dockerfile usage
  runtime:
    type: docker
    dockerfile: ./Dockerfile
  build:
    # Force Dockerfile build instead of buildpacks
    dockerfile: ./Dockerfile # Changed for consistency
    # Build environment variables
    env:
      NEXT_PUBLIC_DEPLOY_ENV: choreo
      NEXT_PUBLIC_API_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      APP_URL: https://lumo-1615540597-6c8cb9466f-w76w6-choreo.apps.cloudmobility.io
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      NODE_ENV: production
      # Database connection for Prisma client generation
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Disable caching to prevent corruption
      DOCKER_BUILDKIT_CACHE: "false"
      BUILDKIT_INLINE_CACHE: "0"
    # Use simple docker build command
    command: echo "Using Dockerfile build - no custom build command needed"
    retryCount: 3
    timeoutSeconds: 600
    network:
      connectTimeoutSeconds: 120
  deploy:
    # Simple startup command - deployment scripts are in Dockerfile
    command: node server.js
    env:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      DEPLOY_ENV: choreo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    containerPort: 3000
    # No baseMount needed for Docker builds
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_PUBLIC_APP_VERSION
      value: ${GITHUB_SHA}
    # Database Configuration - REQUIRED
    - name: DATABASE_URL
      valueFrom:
        secretRef:
          name: DATABASE_URL
    # JWT Secret for custom auth - REQUIRED
    - name: JWT_SECRET
      valueFrom:
        secretRef:
          name: JWT_SECRET
  resources:
    cpu:
      units: 2
    memory:
      units: 4Gi
  scaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  healthCheck:
    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 45
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
  expose:
    type: HTTP
    port: 3000
  ignoreSpec:
    ignore:
      - node_modules
      - .git
      - .github
      - .next
      - .env
      - .env.local
      - .env.development
      - .env.production
      - README.md
      - "**/*.test.js"
      - "**/*.test.ts"
      - "**/*.spec.js"
      - "**/*.spec.ts"
      - "**/__tests__/**"
      - "**/__mocks__/**"
      - "**/coverage/**"
      - "**/logs/**"
      - "**/temp/**"
      - "**/tmp/**"
      # Exclude files that might cause cache issues
      - "**/.cache/**"
      - "**/*.cache"
      - next.config.backup.ts
      - next.config.simple.js 