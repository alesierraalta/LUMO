apiVersion: core.choreo.dev/v1beta1
kind: Component
metadata:
  name: lumo
  description: LUMO Inventory Management System
spec:
  type: web-application
  
  # Build Configuration
  build:
    buildType: dockerfile
    dockerfilePath: ./Dockerfile
    
  # Container Configuration  
  container:
    image: lumo:latest
    
  # Environment Variables
  env:
    - name: NODE_ENV
      value: "production"
    - name: APP_NAME
      value: "LUMO"
    - name: APP_VERSION
      value: "1.0.0"
    - name: CHOREO_ENVIRONMENT
      value: "Production"
    - name: FORCE_SUPABASE
      value: "true"
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"
    - name: PORT
      value: "8081"
    - name: STARTUP_TIMEOUT
      value: "60"
      
  # Secrets (configurar en Choreo Console)
  secrets:
    - name: NEXT_PUBLIC_SUPABASE_URL
    - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - name: SUPABASE_URL
    - name: SUPABASE_KEY
    - name: JWT_SECRET
    - name: DATABASE_URL
    - name: NEXTAUTH_SECRET
    - name: NEXTAUTH_URL
    
  # Endpoints
  endpoints:
    - name: lumo-app
      service:
        name: lumo
        port: 8080
      context: /
      schemaFilePath: openapi.yaml
      
  # Health Checks - OPTIMIZADOS PARA EVITAR TIMEOUT
  probes:
    readiness:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 5
      
    liveness:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
      
    startup:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 20
      
  # Resource Configuration - AUMENTADOS
  resources:
    requests:
      memory: "6Gi"
      cpu: "3000m"
    limits:
      memory: "12Gi"
      cpu: "6000m"
      
  # Scaling Configuration
  scaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80 